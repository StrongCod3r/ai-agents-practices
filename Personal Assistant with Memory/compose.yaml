services:
  ollama:
    image: ollama/ollama:0.40.7
    restart: unless-stopped
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
    ports:
      - "127.0.0.1:11435:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: memory_assistant
      POSTGRES_USER: memory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - memory-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory -d memory_assistant"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  ollama-data:
  memory-data:
